<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Momora — Print</title>
    <!--
      memory-book-5c plan, Step 2b: NO Google Fonts CDN link here (unlike
      index.html/web.html, which still load it — see each file's own tag).
      The print pipeline vendors Newsreader/Plus Jakarta Sans/Caveat locally
      (src/print/fonts/*.woff2, OFL-licensed — see fonts/OFL-LICENSES.txt)
      and imports the local @font-face stylesheet from src/print/main.tsx,
      because a transient CDN failure at render time must never silently
      ship a wrong-font book to print — the exact V4 silent-fallback defect
      class this step exists to close. `PrintApp.tsx` hard-fails
      (`data-print-error`) if any vendored face doesn't actually end up
      loaded (`assertPrintFontsLoaded`), rather than trusting the network.
    -->
    <style>
      /*
       * Base reset only — the exact `@page`/html/body physical size for the
       * requested page/half/cover is injected at runtime by PrintApp.tsx
       * once it knows which one was requested (see its `usePageBox` sizing
       * effect), because it varies per request (216x216mm single page,
       * 213x216mm spread half, or the cover's own back+spine+front width).
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      /*
       * NO line-height reset here. The original pipeline set
       * `#root { line-height: 0 }` (the blunt fix for inline-image baseline
       * gaps), but the app preview has no such reset, so every text block
       * lacking its own explicit line-height rendered differently in print
       * than in the QA'd preview — glyphs collapsed upward onto adjacent
       * images (owner-found defects: Through-The-Years labels round 21,
       * PhotoTile numerals/scan text round 23). Images are made block-level
       * instead, which kills the same whitespace gap without poisoning text
       * metrics.
       */
      #root img {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/print/main.tsx"></script>
  </body>
</html>
