<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Momora — Book</title>
    <!--
      Same asset as usemomora.com's own favicon (`src/web/momora-favicon.png`)
      — referenced through Vite's asset pipeline (an absolute `/src/web/...`
      href, resolved against this config's `root`, same convention as the
      `<script>` tag below) so it gets a content hash and ships from
      `dist-web/assets/` on a real build, never a path outside the bundle.
    -->
    <link rel="icon" type="image/png" href="/src/web/momora-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Same Google Fonts link the preview (index.html) and print (print.html)
      entries use (plan Risk "Fonts": "already loaded by both existing
      entries; same for web.html").
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
