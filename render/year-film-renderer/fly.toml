# Year Film render worker — Fly.io app config (docs/plans/year-film-p1.md
# Decision 2). No HTTP service: cloudflare/year-film-worker creates one-off
# machines per job through the Machines API (sizes chosen there:
# performance-8x/16GB for renders, 4x fallback). This file names the app and
# records the F5 sizing; deploys stay owner-run (README.md "Deploy").
app = "momora-year-film-renderer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  # F5 (2026-09-28): 63s sample in 93s at ≈ $0.007/film — 2.8× faster than
  # performance-4x and cheaper per film; performance-2x fails on Fly
  # (HyperFrames "Missing manifest"). See docs/plans/year-film.md F5.
  size = "performance-8x"
  memory = "16gb"
