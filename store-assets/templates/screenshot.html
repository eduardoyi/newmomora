<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Momora — Store Screenshot</title>
<style>
  @font-face {
    font-family: "Newsreader";
    src: url("../fonts/Newsreader/Newsreader_400Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Newsreader";
    src: url("../fonts/Newsreader/Newsreader_500Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "Newsreader";
    src: url("../fonts/Newsreader/Newsreader_400Regular_Italic.ttf") format("truetype");
    font-weight: 400;
    font-style: italic;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../fonts/PlusJakartaSans/PlusJakartaSans_400Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../fonts/PlusJakartaSans/PlusJakartaSans_500Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../fonts/PlusJakartaSans/PlusJakartaSans_700Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "Caveat";
    src: url("../fonts/Caveat/Caveat_400Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Caveat";
    src: url("../fonts/Caveat/Caveat_700Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }

  :root {
    /* Layout is authored in a fixed 1260-unit-wide coordinate space.
       --scale maps it to the requested canvas width; --stage-h (in
       1260-space units) is recomputed per output size so stage-h * scale
       always equals the target canvas height exactly. Top-level vertical
       placement uses percentages of stage height so blocks reflow
       proportionally between the different canvas aspect ratios
       (appstore ~0.460, appstore-alt ~0.460, play 0.5625). */
    --canvas-w: 1260;
    --canvas-h: 2736;
    --scale: 1;
    --stage-h: 2736;

    --color-paper: #FAFAFD;
    --color-primary: #D63E78;
    --color-primary-dark: #B22A60;
    --color-soft-pink: #FBD3E2;
    --color-tint: #FDEAF1;
    --color-ink: #2C2418;
    --color-ink2: #6B5E4F;
    --color-surface: #F4F3F8;
    --color-border: #EBE7F2;

    --emotion-joy: #FFE7B0;
    --emotion-wonder: #CFE1F4;
    --emotion-calm: #D6EDDE;
    --emotion-tender: #FBD6E1;
    --emotion-mischief: #E5D2F1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: calc(var(--canvas-w) * 1px);
    height: calc(var(--canvas-h) * 1px);
    overflow: hidden;
    background: var(--color-paper);
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1260px;
    height: calc(var(--stage-h) * 1px);
    transform-origin: top left;
    transform: scale(var(--scale));
  }

  #bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(214, 62, 120, 0.07), rgba(214, 62, 120, 0) 60%),
      var(--color-paper);
  }

  /* Wordmark lockup — small "momora" + pink dot, present on every slide. */
  #wordmark {
    position: absolute;
    top: 1.9%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: baseline;
    font-family: "Newsreader", serif;
    font-weight: 500;
    font-size: 46px;
    line-height: 1;
    color: var(--color-ink);
    letter-spacing: -0.01em;
    z-index: 8;
  }

  #wordmark .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-primary);
    margin-left: 5px;
    transform: translateY(-3px);
  }

  #wordmark.bottom {
    top: auto;
    bottom: 3.2%;
    font-size: 84px;
  }

  #wordmark.bottom .dot {
    width: 16px;
    height: 16px;
    margin-left: 8px;
    transform: translateY(-6px);
  }

  /* Soft paper glow behind the bottom wordmark so it stays legible when it
     sits over the full-bleed art of a hero slide. */
  #wordmark.bottom .glow {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 620px;
    height: 260px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(250, 250, 253, 0.92), rgba(250, 250, 253, 0) 70%);
    z-index: -1;
    border-radius: 50%;
  }

  #caption {
    position: absolute;
    top: 5.48%;
    left: 90px;
    right: 90px;
    text-align: center;
    z-index: 7;
  }

  #headline {
    font-family: "Newsreader", serif;
    font-weight: 500;
    font-style: normal;
    font-size: 100px;
    line-height: 1.1;
    color: var(--color-ink);
    letter-spacing: -0.01em;
    margin: 0;
  }

  #script-accent {
    display: none;
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 74px;
    color: var(--color-primary);
    margin-top: 18px;
    line-height: 1;
  }

  #subline {
    display: none;
    margin: 26px 0 0;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 500;
    font-size: 46px;
    line-height: 1.4;
    color: var(--color-ink2);
  }

  /* ---- Device frame layout ---- */
  #device-wrap {
    position: absolute;
    left: 50%;
    top: 20.47%;
    transform: translateX(-50%);
    width: 1040px;
    height: 76.75%;
    z-index: 2;
  }

  #device-wrap.bleed {
    top: auto;
    bottom: -5.12%;
  }

  #device {
    position: relative;
    width: 100%;
    height: 100%;
    background: #1a1518;
    border-radius: 96px;
    padding: 22px;
    box-shadow: 0 60px 120px -30px rgba(44, 36, 24, 0.35), 0 20px 40px -10px rgba(44, 36, 24, 0.18);
  }

  #screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 74px;
    overflow: hidden;
    background: var(--color-paper);
  }

  #screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  /* Clean replacement status bar. It sits over the top strip of the
     screenshot (which is anchored object-position:top), fully covering the
     raw capture's own status bar (~120px at 1170-wide source scale ≈
     ~102px in 996px screen space; we use 106px for margin). Background is
     parameterized (statusbar_bg) to match each screenshot's own
     top-of-screen tone. */
  #statusbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 106px;
    z-index: 4;
    background: var(--color-paper);
  }

  #statusbar .time,
  #statusbar .glyphs {
    position: absolute;
    top: 8px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #12100E;
  }

  /* Left/right "ears" beside the dynamic island: island is 220px wide,
     centered in the 996px screen, so each ear is (996-220)/2 = 388px. */
  #statusbar .time {
    left: 0;
    width: 388px;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.01em;
  }

  #statusbar .glyphs {
    right: 0;
    width: 388px;
    gap: 12px;
  }

  #statusbar .glyphs svg {
    display: block;
  }

  #dynamic-island {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 62px;
    background: #0a080a;
    border-radius: 40px;
    z-index: 5;
  }

  /* ---- iPad device-frame variant (tablet buckets: ipad, play-tablet7,
     play-tablet10) ---- Slimmer uniform bezel than the iPhone frame,
     squarer corners, no dynamic island. Device width is a percentage of
     the (always-1260px-wide) stage, so it's an absolute local value
     regardless of the target canvas's aspect ratio — same "fixed local
     chrome" pattern the iPhone frame uses. Height is derived from width
     via aspect-ratio (iPad Pro 13" screenshot aspect, 2064:2752) instead
     of a fixed percent of stage height, so it naturally bleeds off the
     bottom edge on tall/narrow canvases. */
  #device-wrap.device-ipad {
    width: 81%;
    height: auto;
    aspect-ratio: 2064 / 2752;
  }

  #device-wrap.device-ipad #device {
    border-radius: 56px;
    padding: 1.6%;
  }

  #device-wrap.device-ipad #screen {
    border-radius: 40px;
  }

  #device-wrap.device-ipad #dynamic-island {
    display: none;
  }

  #device-wrap.device-ipad #statusbar {
    display: none;
  }

  /* Replacement status bar for the iPad captures: crops the raw capture's
     own status bar strip (measured at 64px tall in the 2064x2752 source,
     i.e. y=19-45 for the "11:19 PM Sat Jul 18" text with margin before the
     app's own header content, which starts no earlier than y=84). No
     dynamic island, so time+date sit flush left and wifi/battery flush
     right — matches real iPadOS status bar layout. */
  #statusbar-ipad {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    z-index: 4;
    background: var(--color-paper);
  }

  #device-wrap.device-ipad #statusbar-ipad {
    display: block;
  }

  #statusbar-ipad .time,
  #statusbar-ipad .glyphs {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    color: #12100E;
  }

  #statusbar-ipad .time {
    left: 30px;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.01em;
    gap: 8px;
  }

  #statusbar-ipad .glyphs {
    right: 30px;
    gap: 10px;
  }

  #statusbar-ipad .glyphs svg {
    display: block;
  }

  /* ---- Hero layout (no device frame, full-bleed art) ----
     The container's top edge is set from JS: it starts just below the
     rendered caption block (so the caption always sits on clean paper at
     every aspect ratio) plus a small intentional gap, and runs to the
     bottom edge — roughly the lower 78-82% of the canvas. The soft fade
     covers the top ~12% of the art. */
  #hero-art {
    display: none;
    position: absolute;
    left: -12px;
    right: -12px;
    top: 20%;
    bottom: -12px;
    z-index: 1;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
  }

  #hero-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .layout-hero #device-wrap { display: none; }
  .layout-hero #hero-art { display: block; }

  /* ---- Decorative chips (floating pastel emotion squares). Rendered
     ABOVE the device frame (z-index 6 > device's 2) so a chip near the
     bezel reads as an intentional floating element, never as a sliver
     peeking out from behind the device. ---- */
  #chips {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
  }

  .chip {
    position: absolute;
    border-radius: 26%;
    box-shadow: 0 16px 32px -12px rgba(44, 36, 24, 0.22);
    border: 3px solid rgba(255, 255, 255, 0.65);
  }

  /* Optional generated-art spot slot (absolute positioned, off by default). */
  #art-slot {
    position: absolute;
    display: none;
    object-fit: contain;
  }
  #art-slot.visible {
    display: block;
  }

  /* ---- Disclosure line (small legal/subscription line under the support
     copy, e.g. "Printed books sold separately. Shipping extra."). Must stay
     legible — WP-D acceptance requirement for frame 05. ---- */
  #disclosure {
    display: none;
    margin: 22px 0 0;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.4;
    color: var(--color-ink2);
  }

  /* ---- Card layout (WP-D §1b/§1c) ----
     A genuine UI crop is the dominant subject on the cream paper background,
     instead of a whole screenshot inside a device frame. Cards/insets are
     placed in a 1260-unit-wide authored space, same as everything else, so
     one --scale transform handles every canvas size. */
  .layout-card #device-wrap,
  .layout-card #hero-art {
    display: none;
  }

  #card-layer {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .layout-card #card-layer {
    display: block;
  }

  .paper-card {
    position: absolute;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 50px 100px -28px rgba(44, 36, 24, 0.32), 0 16px 36px -12px rgba(44, 36, 24, 0.16);
  }

  .paper-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Truthful labeled inset (spec §1c): a smaller secondary crop with a short
     honest caption chip, e.g. "Saved sound", "In the app". */
  .inset-card {
    position: absolute;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 34px 70px -20px rgba(44, 36, 24, 0.30), 0 10px 24px -8px rgba(44, 36, 24, 0.16);
    border: 6px solid #fff;
  }

  .inset-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  .inset-card .inset-label {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    background: rgba(20, 16, 12, 0.82);
    color: #fff;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.01em;
    padding: 10px 22px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* A placeholder inset/panel used when NO genuine capture exists for that
     part of the composition. Deliberately neutral (grey/dashed), never
     styled to look like real product UI, per the standing "never draw
     invented product functionality" rule — a missing capture is labeled,
     not illustrated. */
  .inset-placeholder {
    position: absolute;
    border-radius: 28px;
    border: 4px dashed #9A8B79;
    background: repeating-linear-gradient(
      135deg,
      rgba(154, 139, 121, 0.10),
      rgba(154, 139, 121, 0.10) 22px,
      rgba(154, 139, 121, 0.16) 22px,
      rgba(154, 139, 121, 0.16) 44px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .inset-placeholder .inset-placeholder-label {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: #6B5E4F;
    line-height: 1.35;
  }

  /* ---- Blocked layout (WP-D fully-blocked frames, e.g. 02/04) ----
     No genuine capture exists at all for this frame's product evidence.
     Renders a plainly labeled empty proof area naming the exact missing
     capture — never a drawn mock of the missing screen. */
  #blocked-area {
    display: none;
    position: absolute;
    left: 8%;
    right: 8%;
    top: 34%;
    bottom: 10%;
    border-radius: 56px;
    border: 5px dashed #9A8B79;
    background: repeating-linear-gradient(
      135deg,
      rgba(154, 139, 121, 0.08),
      rgba(154, 139, 121, 0.08) 30px,
      rgba(154, 139, 121, 0.14) 30px,
      rgba(154, 139, 121, 0.14) 60px
    );
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6%;
    z-index: 2;
  }
  .layout-blocked #blocked-area {
    display: flex;
  }
  .layout-blocked #device-wrap,
  .layout-blocked #hero-art,
  .layout-blocked #card-layer {
    display: none;
  }

  #blocked-area .blocked-title {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    font-size: 44px;
    color: #6B5E4F;
    margin-bottom: 20px;
  }

  #blocked-area .blocked-route {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 40px;
    color: #2C2418;
    background: rgba(255, 255, 255, 0.65);
    border-radius: 16px;
    padding: 14px 30px;
    word-break: break-word;
  }

  /* ---- Reconstruction layout (WP-owner-directed faithful UI rebuilds) ----
     HTML/CSS recreations of real screens/controls, built from the actual
     component source (see each builder function below) and the real design
     tokens mirrored at the top of this file. These render INSIDE the normal
     device frame (#device-wrap/#device/#screen), replacing the raw
     screenshot <img> with a live-built DOM tree, so the existing device
     skin/status-bar/chip system is unchanged. A reconstruction is NOT a
     native capture -- every asset built this way is provenance-classed
     `ui-reconstruction` in store-assets/v2/ASSET-MANIFEST.json. Copy is
     always supplied by the manifest's `reconstruction` param (never
     hard-coded here) so wording stays editable without touching this file. */
  .layout-reconstruction #hero-art,
  .layout-reconstruction #card-layer,
  .layout-reconstruction #blocked-area {
    display: none;
  }
  .layout-reconstruction #screenshot {
    display: none;
  }
  #recon-root {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    background: var(--color-paper);
  }
  .layout-reconstruction #recon-root {
    display: flex;
  }
  /* One genuine control, pulled out of the device and enlarged (the
     Tinybeans-style "device + real UI + enlarged callout" technique the
     owner asked for). Built from the SAME markup-building functions as the
     in-device control, just at a larger scale -- never a redesigned or
     idealized version of it. */

  /* Owner round 2026-09-21: depth layer. Floating pieces of the journal that
     break out of the phone frame so the set reads as full of life rather than
     a flat product shot. Purely marketing chrome -- never product UI. */
  #overlay-layer {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }
  #overlay-layer .ov {
    position: absolute;
    transform-origin: center center;
  }
  #overlay-layer .ov-note {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 2px 4px rgba(44,36,24,0.06), 0 22px 46px rgba(44,36,24,0.16);
    padding: 26px 28px;
    font-family: 'Newsreader';
    color: #2C2418;
    line-height: 1.42;
  }
  #overlay-layer .ov-note .ov-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
  }
  #overlay-layer .ov-date {
    font-family: 'Plus Jakarta Sans'; font-weight: 700;
    letter-spacing: 0.1em; color: #9A8B79;
  }
  #overlay-layer .ov-chip {
    display: inline-flex; align-items: center; gap: 8px;
    border-radius: 999px; padding: 7px 16px 7px 11px;
    font-family: 'Plus Jakarta Sans'; font-weight: 700;
  }
  #overlay-layer .ov-chip i { width: 10px; height: 10px; border-radius: 999px; display: block; }
  #overlay-layer .ov-pill {
    display: inline-flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 999px;
    box-shadow: 0 2px 4px rgba(44,36,24,0.06), 0 16px 36px rgba(44,36,24,0.16);
    padding: 18px 28px;
    font-family: 'Plus Jakarta Sans'; font-weight: 700; color: #2C2418;
  }
  #overlay-layer .ov-pill .spin {
    width: 22px; height: 22px; border-radius: 999px;
    border: 3px solid #FBD3E2; border-top-color: #D63E78;
    transform: rotate(140deg);
  }
  #overlay-layer .ov-pill .tick {
    width: 30px; height: 30px; border-radius: 999px; background: #D63E78;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  #overlay-layer .ov-bubble {
    background: #fff; border-radius: 26px;
    box-shadow: 0 2px 4px rgba(44,36,24,0.06), 0 20px 40px rgba(44,36,24,0.16);
    padding: 20px 24px; display: flex; gap: 14px; align-items: flex-start;
  }
  #overlay-layer .ov-bubble .av {
    width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans'; font-weight: 700; color: #2C2418;
  }
  #overlay-layer .ov-bubble .who {
    font-family: 'Plus Jakarta Sans'; font-weight: 700; color: #2C2418;
  }
  #overlay-layer .ov-bubble .said {
    font-family: 'Newsreader'; color: #2C2418; line-height: 1.38; margin-top: 4px;
  }
  #overlay-layer .ov-heart { color: #D63E78; line-height: 1; filter: drop-shadow(0 8px 18px rgba(214,62,120,0.30)); }
  #overlay-layer .ov-sparkle { color: #F2B441; line-height: 1; }
  #overlay-layer .ov-photo {
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 2px 4px rgba(44,36,24,0.08), 0 22px 44px rgba(44,36,24,0.20);
  }
  #overlay-layer .ov-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #overlay-layer .ov-stat {
    background: #D63E78; color: #fff; border-radius: 26px;
    box-shadow: 0 2px 4px rgba(214,62,120,0.20), 0 20px 40px rgba(214,62,120,0.30);
    padding: 22px 30px; text-align: center;
  }
  #overlay-layer .ov-stat b { display: block; font-family: 'Newsreader'; font-weight: 500; }
  #overlay-layer .ov-stat span { font-family: 'Plus Jakarta Sans'; font-weight: 700; opacity: 0.92; }

  #callout-layer {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 7;
  }
  .layout-reconstruction #callout-layer {
    display: block;
  }
  .recon-callout {
    position: absolute;
    background: #fff;
    border-radius: 36px;
    box-shadow: 0 46px 100px -20px rgba(44, 36, 24, 0.36), 0 16px 34px -10px rgba(44, 36, 24, 0.18);
    border: 1px solid var(--color-border);
    padding: 30px;
  }
  .recon-callout-label {
    position: absolute;
    left: 50%;
    bottom: -24px;
    transform: translateX(-50%);
    background: rgba(20, 16, 12, 0.86);
    color: #fff;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.01em;
    padding: 9px 22px;
    border-radius: 999px;

    top: 24%;

    transform: translateY(-50%) rotate(-4deg);

  <script>
    // Params are injected by render.mjs as window.__SLIDE__ = {...}
    // Falls back to a ?data=<base64 json> query param for manual preview.
    function getSlideData() {
      if (window.__SLIDE__) return window.__SLIDE__;
      const usp = new URLSearchParams(location.search);
      const raw = usp.get("data");
      if (raw) {
        try {
          return JSON.parse(decodeURIComponent(escape(atob(raw))));
        } catch (e) {
          console.error("Failed to parse data param", e);
        }
      }
      return {};
    }

    const SIZES = {
      appstore: { w: 1260, h: 2736 },
      "appstore-alt": { w: 1320, h: 2868 },
      "appstore-65": { w: 1284, h: 2778 },
      play: { w: 1080, h: 1920 },
      ipad: { w: 2064, h: 2752 },
      "play-tablet7": { w: 1080, h: 1920 },
      "play-tablet10": { w: 1620, h: 2880 },

    // Buckets that use the iPad capture set + iPad device frame instead of
    // the iPhone one.
    const TABLET_SIZES = new Set(["ipad", "play-tablet7", "play-tablet10"]);

    function applyScale(sizeKey) {
      const target = SIZES[sizeKey] || SIZES.appstore;
      const scale = target.w / 1260;
      const stageHeightUnits = 1260 * (target.h / target.w);

      document.documentElement.style.setProperty("--scale", String(scale));
      document.documentElement.style.setProperty("--stage-h", String(stageHeightUnits));
      document.documentElement.style.width = target.w + "px";
      document.documentElement.style.height = target.h + "px";
      document.body.style.width = target.w + "px";
      document.body.style.height = target.h + "px";
    }

    // ---------------------------------------------------------------------
    // Reconstruction builders (owner-directed faithful UI rebuilds, PLAN.md
    // §3a.2). Each function below is named for, and structured after, the
    // ONE real component file it reconstructs -- see the comment at the top
    // of each for the exact source path, so a reviewer can diff this markup
    // against that file directly. Colors are hand-mirrored from
    // src/constants/theme.ts (same practice this file already uses for its
    // CSS custom properties above); every piece of COPY is read from the
    // `recon` object the manifest supplies, never hard-coded here.
    // ---------------------------------------------------------------------
    const RECON_THEME = {
      bg: "#FAFAFD",
      ink: "#2C2418",
      ink2: "#6B5E4F",
      ink3: "#9A8B79",
      border: "#EBE7F2",
      borderStrong: "#CFC8E0",
      surface: "#F4F3F8",
      surface2: "#F2EFF8",
      white: "#FFFFFF",
      primary: "#D63E78",
      primaryDark: "#B22A60",
      primaryTint: "#FDEAF1",
      seaSoft: "#C9ECE9",
      seaInk: "#1f5a56",
    };

    // Mirrors src/constants/theme.ts's emotionColors -- only the entries this
    // template actually uses. Kept minimal and hand-verified against that
    // file rather than copying the whole table.
    const RECON_EMOTION_COLORS = {
      funny: { c: "#F07E3A", soft: "#FCDCC0", ink: "#8a4416" },
      wonder: { c: "#4F8FCC", soft: "#CFE1F4", ink: "#3a5b7a" },
      tender: { c: "#EC7FA1", soft: "#FBD6E1", ink: "#9c4f68" },
    };

    function reconEsc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
      ));
    }

    // Shared "Set aside / Keep this" pill pair -- gallery-import-review.tsx
    // styles.secondaryAction / styles.keepAction (the real accessible
    // buttons that sit under the deck card; the card itself only shows
    // these words as drag-intent stamps mid-swipe). `scale` lets the same
    // markup serve both the in-device row and the enlarged callout.
    function reconKeepAsideRow(recon, scale) {
      const pad = Math.round(16 * scale);
      const gap = Math.round(10 * scale);

            <span style="font-size:${iconSize}px;color:${RECON_THEME.ink2};line-height:1;">&#10005;</span>

          </div>
          <div style="flex:1.25;display:flex;align-items:center;justify-content:center;gap:7px;min-height:${minH}px;padding:0 ${pad}px;white-space:nowrap;background:${RECON_THEME.primary};border-radius:${radius}px;">
            <span style="font-size:${iconSize}px;color:${RECON_THEME.white};line-height:1;">&#10003;</span>
            <span style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:${fontSize}px;color:${RECON_THEME.white};white-space:nowrap;">${reconEsc(recon.actions.keep)}</span>
          </div>

    }

    // src/components/gallery-import/gallery-import-deck-card.tsx (the deck
    // card: hero photo + script date stamp + film-strip row + date + AI
    // caption) plus gallery-import-review.tsx's DeckTopBar and the
    // sticky Set-aside/Keep action row underneath it.
    function reconGalleryImportDeck(root, recon, isTablet) {
      // Coordinator fix (2026-09-20 review round 2): the deck card is
      // `position:'absolute', top/left/right/bottom:0` inside a `flex:1`
      // `deck` container in the real component (gallery-import-review.tsx
      // styles.deck/styles.card) -- it fills essentially the ENTIRE space
      // between the tick row and the sticky footer, not a fixed-height card
      // floating in a mostly-empty screen. The card's own `hero` slot is
      // likewise `flex:1, minHeight:160` (gallery-import-deck-card.tsx),
      // so the photo grows to fill whatever room the fixed-height rows
      // below it (film-strip/divider/date/caption) leave. Reproduced here
      // with the same flex:1-in-flex:1 structure instead of a fixed height.
      const tickCount = 7;
      const doneTicks = 2;
      const activeTick = 2;
      const ticksHtml = Array.from({ length: tickCount }).map((_, i) => {
        const bg = i < doneTicks ? RECON_THEME.primary : i === activeTick ? RECON_THEME.primaryTint : RECON_THEME.border;
        return `<span style="flex:1;max-width:26px;height:3px;border-radius:999px;background:${bg};display:inline-block;"></span>`;
      }).join("");
      root.innerHTML = `
        <div style="display:flex;align-items:center;padding:0 6px;flex-shrink:0;">
          <span style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:30px;color:${RECON_THEME.primary};">${reconEsc(recon.topBar.close)}</span>

          <span style="display:flex;align-items:center;gap:8px;background:${RECON_THEME.white};border:1px solid ${RECON_THEME.border};border-radius:999px;padding:11px 20px;font-family:'Plus Jakarta Sans';font-weight:700;font-size:21px;color:${RECON_THEME.ink2};">

        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:16px 6px 0;flex-shrink:0;">

          <span style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <span style="width:8px;height:8px;border-radius:999px;background:${RECON_THEME.seaSoft};"></span>
            <span style="font-family:'Plus Jakarta Sans';font-size:19px;color:${RECON_THEME.ink3};">${reconEsc(recon.topBar.comingLabel || "more coming")}</span>
          </span>
        </div>
        <div style="flex:1;display:flex;min-height:0;padding:20px 6px;">
          <div style="flex:1;display:flex;flex-direction:column;min-height:0;width:100%;background:${RECON_THEME.white};border:1px solid ${RECON_THEME.border};border-radius:44px;padding:22px;box-shadow:0 40px 90px -22px rgba(40,30,20,0.18);">
            <div style="flex:1;min-height:120px;position:relative;border-radius:26px;overflow:hidden;background:${RECON_THEME.primaryTint};">
              <img src="${recon.card.heroImage}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
              <span style="position:absolute;right:16px;bottom:12px;font-family:'Caveat';font-weight:700;font-size:32px;color:rgba(60,44,30,0.68);transform:rotate(-4deg);">${reconEsc(recon.card.dateStamp)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:14px;min-height:64px;margin-top:16px;flex-shrink:0;">
              <span style="flex:1;font-family:'Plus Jakarta Sans';font-weight:700;font-size:22px;color:${RECON_THEME.ink2};">${reconEsc(recon.card.chosenLabel)}</span>
              <span style="font-family:'Newsreader';font-size:38px;color:${RECON_THEME.ink3};line-height:1;">&rsaquo;</span>
            </div>
            <div style="height:1px;background:${RECON_THEME.border};margin:18px 0;flex-shrink:0;"></div>
            <div style="font-family:'Plus Jakarta Sans';font-weight:700;font-size:17px;letter-spacing:0.09em;text-transform:uppercase;color:${RECON_THEME.ink3};flex-shrink:0;">${reconEsc(recon.card.date)}</div>
            <div style="font-family:'Newsreader';font-size:33px;line-height:1.4;color:${RECON_THEME.ink};margin-top:12px;flex-shrink:0;">${reconEsc(recon.card.caption)}</div>
          </div>
        </div>
        <div style="padding:0 6px ${isTablet ? 40 : 60}px;flex-shrink:0;">
          ${reconKeepAsideRow(recon, 1.75)}
          <div style="text-align:center;font-family:'Plus Jakarta Sans';font-size:19px;color:${RECON_THEME.ink3};margin-top:16px;">${reconEsc(recon.actions.note)}</div>
        </div>`;
    }

    // src/components/audio/sound-trace.tsx's SoundTrace, reproduced as a
    // real SVG polyline (not a photographic waveform -- the real component
    // is a stylized deterministic line, never drawn from actual audio
    // samples; see that file's own header comment). `ink` is the neutral
    // graphite tone audio-emotion.ts falls back to before/without emotion
    // analysis, matching this reconstruction's emotion-less demo clip.
    function reconSoundTraceSvg(width, height, progress, scale, inkColor) {
      const ink = inkColor || RECON_THEME.ink2;
      const points = 40;
      const seedish = [0.32, 0.58, 0.41, 0.72, 0.36, 0.5, 0.85, 0.29, 0.63, 0.44, 0.7, 0.33, 0.55, 0.9, 0.31, 0.48, 0.66, 0.38, 0.6, 0.8, 0.34, 0.52, 0.95, 0.3, 0.46, 0.68, 0.4, 0.57, 0.83, 0.35, 0.5, 0.62, 0.28, 0.45, 0.74, 0.37, 0.53, 0.65, 0.32, 0.42];
      let d = "";
      for (let i = 0; i < points; i++) {
        const x = (i / (points - 1)) * width;
        const amp = seedish[i % seedish.length];
        const y = height / 2 + (i % 2 ? 1 : -1) * amp * (height / 2) * 0.9;
        d += `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)} `;
      }
      const clipW = Math.max(0, Math.min(1, progress)) * width;
      const stroke = 2.4 * scale;
      return `
        <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <path d="${d}" fill="none" stroke="${ink}" stroke-opacity="0.42" stroke-width="${stroke}" stroke-linecap="round" />
          <clipPath id="recon-trace-clip"><rect x="0" y="0" width="${clipW}" height="${height}" /></clipPath>
          <path d="${d}" fill="none" stroke="${ink}" stroke-width="${stroke + 0.4}" stroke-linecap="round" clip-path="url(#recon-trace-clip)" />
        </svg>`;
    }

    // The wax-seal listen/pause control -- src/components/audio/listen-seal.tsx.
    // `fillColor` mirrors ListenSeal's `fill = color ?? e.main` (the seal's
    // fill is the emotion's SATURATED `main` color, e.g. emotionColors.funny.c
    // -- not the softer `ink` tone the trace/chip use).
    function reconListenSeal(sizePx, fillColor) {
      const fill = fillColor || RECON_THEME.ink2;
      return `
        <div style="position:relative;width:${sizePx}px;height:${sizePx}px;border-radius:50%;background:${fill};display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px -6px rgba(44,36,24,0.35);flex-shrink:0;">
          <div style="position:absolute;inset:3px;border-radius:50%;border:2px dashed rgba(255,255,255,0.45);"></div>
          <div style="width:0;height:0;margin-left:4px;border-top:${Math.round(sizePx * 0.19)}px solid transparent;border-bottom:${Math.round(sizePx * 0.19)}px solid transparent;border-left:${Math.round(sizePx * 0.3)}px solid #fff;"></div>
        </div>`;
    }

    // The memory-detail SoundStage -- app/(app)/memory/[id]/index.tsx's
    // SoundStage + MemoryDetailSound (framedCard/soundStage/soundStageTrace/
    // soundStageControls/soundStageTimeRow styles), engagement bar, member
    // pill and MemoryMetaFooter underneath it.
    function reconSoundPlayer(root, recon, isTablet) {
      // Coordinator fix (2026-09-20 review round 2), round 2 of this
      // specific fix: the real card is TOP-anchored (framedCard's
      // marginTop:12 only -- no vertical centering) and its image slot is
      // `aspectRatio: 4/3` at the card's full width (styles.framedImage).
      // An earlier attempt made the stage `flex:1` to force it to fill the
      // device -- that structurally filled the space but only stretched the
      // near-white `colors.surface` background around the same small,
      // still-centered waveform/seal cluster, recreating the exact
      // "small thing floating in a big blank box" problem one level down.
      // Reverted to the real, BOUNDED 4:3 aspect ratio. Whatever the phone
      // frame's fixed proportions leave below the card is answered by the
      // real screen's own background: MemoryDetailFramed/MemoryDetailSound
      // wrap the WHOLE screen in `getEmotionGradient(memory.emotion)`
      // (src/constants/theme.ts:72-80; this file's own
      // `styles.emotionGradient`, position:absolute/top:0/height:'60%').
      //
      // Round 3: the clip now carries a real emotion (`funny`, confirmed
      // from source -- audio-emotion.ts's resolveAudioEmotionColors() reads
      // the SAME emotionColors table every other memory type uses, and
      // MemoryDetailSound feeds `memory.emotion` into the same
      // getEmotionGradient()/MemoryMetaFooter emotion-chip calls
      // MemoryDetailFramed does), so the seal/trace/chip now render in the
      // emotion's real color instead of the neutral graphite fallback.
      // NOTE the gradient's own math: emotionGradient's `locations` are
      // [0, 0.45, 1] WITHIN a box that is only `height:'60%'` of the
      // screen -- so the tint fades to flat colors.bg by 0.45*60% = 27% of
      // the full screen, then stays flat colors.bg all the way down. Giving
      // the clip a color therefore only tints the top ~27% (mostly hidden
      // behind the opaque chrome buttons and the card's own top edge,
      // exactly as it would in the real app, since the card is opaque
      // there too) -- it does NOT recolor the lower-third whitespace below
      // the card, which stays colors.bg regardless of emotion. This matches
      // real behavior exactly; it is not a limitation of the reconstruction.
      const emo = recon.player.emotion ? RECON_EMOTION_COLORS[recon.player.emotion] : null;
      const sealFill = emo ? emo.c : RECON_THEME.ink2;
      const traceInk = emo ? emo.ink : RECON_THEME.ink2;
      const gradientStart = emo ? emo.soft : RECON_THEME.surface;
      root.style.background = `linear-gradient(to bottom, ${gradientStart} 0%, ${RECON_THEME.bg} 27%, ${RECON_THEME.bg} 100%)`;
      root.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;flex-shrink:0;">
          <span style="width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-family:'Newsreader';font-size:34px;color:rgba(44,36,24,0.75);">&lsaquo;</span>
          <span style="width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:700;font-size:20px;color:rgba(44,36,24,0.75);">&bull;&bull;&bull;</span>

    // Floating overlay pieces (marketing chrome, never product UI).
    function renderOverlays(overlays, isTablet) {
      const layer = document.getElementById("overlay-layer");
      if (!overlays || !overlays.length) { layer.innerHTML = ""; return; }
      layer.innerHTML = overlays.map((o) => {
        const key = isTablet && o.tablet ? Object.assign({}, o, o.tablet) : o;
        const pos = `left:${key.left_pct}%;top:${key.top_pct}%;` +
          (key.width_pct ? `width:${key.width_pct}%;` : "") +
          (key.height_pct ? `height:${key.height_pct}%;` : "") +
          `transform:translate(-50%,-50%) rotate(${key.rotate || 0}deg);`;
        if (o.type === "note") {
          return `<div class="ov ov-note" style="${pos}font-size:${key.size || 26}px;${o.italic ? "font-style:italic;" : ""}">
            ${reconEsc(o.text)}
            ${o.date || o.emotion ? `<div class="ov-meta">
              <span class="ov-date" style="font-size:${(key.size || 26) * 0.6}px;">${reconEsc(o.date || "")}</span>
              ${o.emotion ? `<span class="ov-chip" style="background:${o.emotionSoft};color:${o.emotionInk};font-size:${(key.size || 26) * 0.62}px;"><i style="background:${o.emotionColor};"></i>${reconEsc(o.emotion)}</span>` : ""}
            </div>` : ""}
          </div>`;
        }
        if (o.type === "pill") {
          const lead = o.state === "done" ? `<span class="tick">&#10003;</span>` : `<span class="spin"></span>`;
          return `<div class="ov ov-pill" style="${pos}font-size:${key.size || 24}px;">${lead}<span>${reconEsc(o.text)}</span></div>`;
        }
        if (o.type === "bubble") {
          return `<div class="ov ov-bubble" style="${pos}">
            <span class="av" style="background:${o.tint};font-size:${(key.size || 23) * 0.8}px;">${reconEsc(o.author.charAt(0))}</span>
            <span><span class="who" style="font-size:${(key.size || 23) * 0.78}px;">${reconEsc(o.author)}</span>
            <span class="said" style="display:block;font-size:${key.size || 23}px;">${reconEsc(o.text)}</span></span>
          </div>`;
        }
        if (o.type === "heart") {
          return `<div class="ov ov-heart" style="${pos}font-size:${key.size || 46}px;opacity:${o.opacity || 1};">&#10084;</div>`;
        }
        if (o.type === "sparkle") {
          return `<div class="ov ov-sparkle" style="${pos}font-size:${key.size || 30}px;opacity:${o.opacity || 1};">&#10022;</div>`;
        }
        if (o.type === "photo") {
          return `<div class="ov ov-photo" style="${pos}"><img src="${o.src}" alt="" /></div>`;
        }
        if (o.type === "stat") {
          return `<div class="ov ov-stat" style="${pos}">
            <b style="font-size:${key.size || 52}px;">${reconEsc(o.value)}</b>
            <span style="font-size:${(key.size || 52) * 0.34}px;">${reconEsc(o.label)}</span>
          </div>`;
        }
        return "";
      }).join("");
    }

    function render() {
      const data = getSlideData();
      const usp = new URLSearchParams(location.search);
      const sizeKey = data.size || usp.get("size") || "appstore";

      applyScale(sizeKey);

      const stage = document.getElementById("stage");
      renderOverlays(data.overlays, TABLET_SIZES.has(sizeKey));
      const headlineEl = document.getElementById("headline");
      const sublineEl = document.getElementById("subline");
      const scriptEl = document.getElementById("script-accent");
      const screenshotEl = document.getElementById("screenshot");
      const deviceWrap = document.getElementById("device-wrap");
      const artSlot = document.getElementById("art-slot");
      const chipsLayer = document.getElementById("chips");
      const wordmark = document.getElementById("wordmark");
      const caption = document.getElementById("caption");
      const heroArtImg = document.getElementById("hero-art-img");
      const statusbar = document.getElementById("statusbar");

      // Headline supports explicit line breaks via "\n" in the manifest
      // (e.g. "Say it.\nWatch it become art.").
      const headlineLines = String(data.headline || "").split("\n");
      headlineLines.forEach((line, i) => {
        if (i > 0) headlineEl.appendChild(document.createElement("br"));
        headlineEl.appendChild(document.createTextNode(line));
      });

      if (data.subline) {
        sublineEl.textContent = data.subline;
        sublineEl.style.display = "block";
      }

      if (data.script_accent) {
        scriptEl.textContent = data.script_accent;
        scriptEl.style.display = "block";
      }

      if (data.caption_top != null) {
        caption.style.top = data.caption_top + "%";
      }

      const disclosureEl = document.getElementById("disclosure");
      if (data.disclosure) {
        disclosureEl.textContent = data.disclosure;
        disclosureEl.style.display = "block";
      }

      // Resolve a param that may be a plain value or a per-size-bucket
      // override map, e.g. { default: 46, ipad: 30 }. Mirrors the existing
      // `top_pct_tablet` convention used by chips, generalized to any bucket
      // key so card/inset placements can differ on the iPad bucket.
      function resolveForSize(value) {
        if (value != null && typeof value === "object" && !Array.isArray(value)) {
          if (Object.prototype.hasOwnProperty.call(value, sizeKey)) return value[sizeKey];
          if (Object.prototype.hasOwnProperty.call(value, "default")) return value.default;
        }
        return value;
      }

      const isTabletBucketGlobal = TABLET_SIZES.has(sizeKey);

      // Layout: "device" (default), "hero" (no frame, full-bleed art),
      // "card" (genuine UI crop(s) as the dominant subject), or "blocked"
      // (no genuine capture exists — a plainly labeled empty proof area).
      if (data.layout === "blocked") {
        stage.classList.add("layout-blocked");
        document.getElementById("blocked-route").textContent = data.blocked && data.blocked.route ? data.blocked.route : "";
      } else if (data.layout === "card") {
        stage.classList.add("layout-card");
        const cardLayer = document.getElementById("card-layer");

        const cardsSpec = (isTabletBucketGlobal && data.cards_tablet) || data.cards || [];
        cardsSpec.forEach((card) => {
          const wrap = document.createElement("div");
          wrap.className = "paper-card";
          const widthPct = resolveForSize(card.width_pct);
          const topPct = resolveForSize(card.top_pct);
          const leftPct = resolveForSize(card.left_pct);
          if (widthPct != null) wrap.style.width = widthPct + "%";
          if (topPct != null) wrap.style.top = topPct + "%";
          if (leftPct != null) wrap.style.left = leftPct + "%";
          if (card.rotate) wrap.style.transform = "rotate(" + card.rotate + "deg)";
          if (card.shadow === false) wrap.style.boxShadow = "none";
          const img = document.createElement("img");
          img.src = card.src;
          img.alt = "";
          wrap.appendChild(img);
          cardLayer.appendChild(wrap);
        });

        const insetsSpec = (isTabletBucketGlobal && data.insets_tablet) || data.insets || (data.inset ? [data.inset] : []);
        insetsSpec.forEach((inset) => {
          const widthPct = resolveForSize(inset.width_pct);
          const topPct = resolveForSize(inset.top_pct);
          const leftPct = resolveForSize(inset.left_pct);
          if (inset.placeholder) {
            const box = document.createElement("div");
            box.className = "inset-placeholder";
            if (widthPct != null) box.style.width = widthPct + "%";
            if (topPct != null) box.style.top = topPct + "%";
            if (leftPct != null) box.style.left = leftPct + "%";
            if (inset.height_pct != null) box.style.height = resolveForSize(inset.height_pct) + "%";
            if (inset.rotate) box.style.transform = "rotate(" + inset.rotate + "deg)";
            const label = document.createElement("div");
            label.className = "inset-placeholder-label";
            label.textContent = inset.label || "Not yet captured";
            box.appendChild(label);
            cardLayer.appendChild(box);
          } else {
            const wrap = document.createElement("div");
            wrap.className = "inset-card";
            if (widthPct != null) wrap.style.width = widthPct + "%";
            if (topPct != null) wrap.style.top = topPct + "%";
            if (leftPct != null) wrap.style.left = leftPct + "%";
            if (inset.rotate) wrap.style.transform = "rotate(" + inset.rotate + "deg)";
            if (inset.reconstruction) {
              // A small real-component widget (not a full screen) built the
              // same data-driven way as the full reconstructions above --
              // see reconStubBandHtml/reconComposerInputHtml.
              const content = document.createElement("div");
              content.innerHTML = inset.reconstruction.kind === "composer-input"
                ? reconComposerInputHtml(inset.reconstruction)
                : reconStubBandHtml(inset.reconstruction);
              wrap.appendChild(content.firstElementChild);
              wrap.style.background = RECON_THEME.white;
            } else {
              const img = document.createElement("img");
              img.src = inset.src;
              img.alt = "";
              wrap.appendChild(img);
            }
            if (inset.label) {
              const label = document.createElement("div");
              label.className = "inset-label";
              label.textContent = inset.label;
              wrap.appendChild(label);
            }
            cardLayer.appendChild(wrap);
          }
        });
      } else if (data.layout === "hero") {
        stage.classList.add("layout-hero");
        if (data.art && data.art.src) {
          heroArtImg.src = data.art.src;
        }
        // Position the art container so its soft top fade BEGINS just below
        // the caption block (caption stays fully on clean paper), with a
        // small intentional gap. Computed from the caption's actual rendered
        // bottom so it holds at every canvas aspect ratio. Re-run once the
        // web fonts have loaded, since the caption's height (and therefore
        // its bottom edge) shifts when fallback metrics are replaced.
        const positionHeroArt = () => {
          const target = SIZES[sizeKey] || SIZES.appstore;
          const stageH = 1260 * (target.h / target.w);
          const captionBottom = caption.offsetTop + caption.offsetHeight;
          const gap = 0.015 * stageH;
          document.getElementById("hero-art").style.top = Math.round(captionBottom + gap) + "px";
        };
        positionHeroArt();
        document.fonts.ready.then(positionHeroArt);
      } else {
        const isTablet = TABLET_SIZES.has(sizeKey);
        const statusbarIpad = document.getElementById("statusbar-ipad");

        if (isTablet) {
          // Tablet buckets always use the iPad capture set + iPad frame
          // (squarer, thinner bezel, no dynamic island), regardless of the
          // manifest's `bleed` flag (which is authored for the iPhone
          // frame/aspect ratios). The iPad frame's height is aspect-ratio
          // driven rather than a fixed percent of stage height.
          deviceWrap.classList.add("device-ipad");
          if (data.layout !== "reconstruction") {
            screenshotEl.src = data.screenshot_tablet || data.screenshot || "";
          }
          const tabletBg = data.statusbar_bg_tablet || data.statusbar_bg;
          if (tabletBg) {
            statusbarIpad.style.background = tabletBg;
          }

          // All tablet buckets position the device dynamically just below
          // the caption's actual rendered bottom (same technique as the
          // hero art layout), then bleed it off the bottom edge. A fixed
          // bottom-anchored offset (like the iPhone .bleed class) is wrong
          // here in both directions: on the squarer 3:4 ipad canvas it
          // pushes the device up into the caption, and on the tall 9:16
          // tablet canvases it leaves a dead paper band between the
          // subline and the frame with the chips stranded in it.
          //
          // On the 9:16 canvases (play-tablet7/10) the stage is 2240 units
          // tall, so a 3:4 frame narrow enough to fit on-canvas can never
          // span from below the caption to the bottom edge — instead the
          // frame width is computed so the aspect-kept frame runs from
          // caption-bottom + gap to just past the bottom edge. That width
          // comes out slightly wider than the canvas (~105-112% depending
          // on caption height), so the sides bleed off-canvas; the clipped
          // strip is mostly bezel plus the capture's own blank margin, and
          // the chips end up overlapping the on-canvas device rather than
          // floating in empty paper. The squarer ipad canvas keeps its
          // approved 81% width (bleeds off the bottom on its own).
          //
          // Re-run once web fonts load since caption height shifts when
          // fallback metrics are replaced.
          const positionTabletDevice = () => {
            const target = SIZES[sizeKey] || SIZES.appstore;
            const stageH = 1260 * (target.h / target.w);
            const captionBottom = caption.offsetTop + caption.offsetHeight;
            // ipad keeps the 2% gap its approved renders shipped with; the
            // 9:16 buckets use a slightly larger 2.5% breathing gap.
            const gap = (sizeKey === "ipad" ? 0.02 : 0.025) * stageH;
            const top = Math.round(captionBottom + gap);
            deviceWrap.style.top = top + "px";
            deviceWrap.style.bottom = "auto";
            if (sizeKey !== "ipad") {
              const overrun = 16; // frame bottom lands this far past the edge
              const neededWidth = Math.ceil((stageH - top + overrun) * (2064 / 2752));
              deviceWrap.style.width = Math.max(neededWidth, 1134) + "px";
            }
          };
          positionTabletDevice();
          document.fonts.ready.then(positionTabletDevice);
        } else {
          if (data.screenshot && data.layout !== "reconstruction") {
            screenshotEl.src = data.screenshot;
          }
          if (data.bleed) {
            deviceWrap.classList.add("bleed");
          }
          if (data.statusbar === false) {
            statusbar.style.display = "none";
          } else if (data.statusbar_bg) {
            statusbar.style.background = data.statusbar_bg;
          }
        }

        // ---- Reconstruction content (WP-owner-directed faithful UI
        // rebuilds) -- built INSIDE the normal device frame above, plus one
        // genuine control pulled out and enlarged into #callout-layer. See
        // the recon* builder functions above render() for the exact source
        // file each one reconstructs. `recon.callout` positioning uses the
        // same width_pct/top_pct/left_pct (optionally per-bucket-keyed)
        // convention as `card`/`inset` placements elsewhere in this file.
        if (data.layout === "reconstruction" && data.reconstruction) {
          stage.classList.add("layout-reconstruction");
          const recon = data.reconstruction;
          const reconRoot = document.getElementById("recon-root");
          reconRoot.style.paddingTop = (recon.kind === "portrait-timeline" ? (isTablet ? 40 : 62) : (recon.kind === "sound-player" ? (isTablet ? 50 : 86) : (isTablet ? 60 : 120))) + "px";
          reconRoot.style.paddingLeft = "34px";
          reconRoot.style.paddingRight = "34px";

          if (recon.kind === "gallery-import-deck") {
            reconGalleryImportDeck(reconRoot, recon, isTablet);
          } else if (recon.kind === "sound-player") {
            reconSoundPlayer(reconRoot, recon, isTablet);
          } else if (recon.kind === "family-invite") {
            reconFamilyInvite(reconRoot, recon, isTablet);
          } else if (recon.kind === "family-collection") {
            reconFamilyCollection(reconRoot, recon, isTablet);
          } else if (recon.kind === "portrait-timeline") {
            reconPortraitTimeline(reconRoot, recon, isTablet);
          } else if (recon.kind === "book-shelf") {
            reconBookShelf(reconRoot, recon, isTablet);
          } else if (recon.kind === "family-feed") {
            reconFamilyFeed(reconRoot, recon, isTablet);
          } else if (recon.kind === "timeline") {
            reconTimeline(reconRoot, recon, isTablet);
          } else if (recon.kind === "memory-detail") {
            reconMemoryDetail(reconRoot, recon, isTablet);
          }

          // The device frame must be FULLY on-canvas for a reconstruction
          // (unlike a real screenshot, which can safely bleed/clip off the
          // bottom edge since it is one continuous image) -- every control
          // our synthetic content draws has to actually be visible. Anchor
          // the frame's top to the caption's real rendered bottom (same
          // technique the hero/tablet layouts already use above), then size
          // it to land on a fixed bottom margin instead of a fixed height
          // percentage: for the iPad frame (aspect-ratio driven) that means
          // solving for the WIDTH that makes the derived height fit exactly;
          // for the iPhone frame (fixed width, percentage height) it means
          // deriving the height from the top/bottom instead of the
          // otherwise-static 76.75%. Re-run once fonts load, since caption
          // height (and so captionBottom) shifts once fallback metrics are
          // replaced.
          // Coordinator fix (2026-09-20 review round 2): the FIRST version of
          // this function sized the device to fill every pixel between the
          // caption and the bottom margin, which is correct for a
          // photo-filled reconstruction (02's hero flex-fills whatever
          // height it is given) but stretched 04/06 into an unnaturally
          // tall, non-iPhone-shaped frame with real content nowhere near
          // large enough to fill it -- the actual visible bug the
          // coordinator flagged. Capping the device at its NORMAL size
          // (the same 76.75%-of-stage-height / 81%-of-stage-width
          // proportions the default, non-reconstruction "device"/"card"
          // layouts already use elsewhere in this file) keeps every
          // reconstruction phone-shaped and consistent with the rest of the
          // deck; only a caption tall enough to need MORE clearance than
          // that leaves the device slightly smaller than normal (never
          // clipped, never stretched).
          const positionReconstructionDevice = () => {
            const target = SIZES[sizeKey] || SIZES.appstore;
            const stageH = 1260 * (target.h / target.w);
            const captionBottom = caption.offsetTop + caption.offsetHeight;
            const gap = 0.02 * stageH;
            const top = Math.round(captionBottom + gap);
            const bottomMargin = Math.round(0.02 * stageH);
            const availableHeight = Math.max(200, stageH - top - bottomMargin);
            if (isTablet) {
              const naturalWidth = 0.81 * 1260;
              const naturalHeight = naturalWidth * (2752 / 2064);
              const height = Math.min(naturalHeight, availableHeight);
              const width = Math.round(height * (2064 / 2752));
              deviceWrap.style.top = top + "px";
              deviceWrap.style.bottom = "auto";
              deviceWrap.style.width = width + "px";
            } else {
              const naturalHeight = 0.7675 * stageH;
              const height = Math.min(naturalHeight, availableHeight);
              deviceWrap.style.top = top + "px";
              deviceWrap.style.height = Math.round(height) + "px";
              deviceWrap.style.bottom = "auto";
            }
          };
          positionReconstructionDevice();
          document.fonts.ready.then(positionReconstructionDevice);

          if (recon.callout) {
            const calloutLayer = document.getElementById("callout-layer");
            const box = document.createElement("div");
            box.className = "recon-callout";
            const widthPct = resolveForSize(recon.callout.width_pct);
            const topPct = resolveForSize(recon.callout.top_pct);
            const leftPct = resolveForSize(recon.callout.left_pct);
            if (widthPct != null) box.style.width = widthPct + "%";
            if (topPct != null) box.style.top = topPct + "%";
            if (leftPct != null) box.style.left = leftPct + "%";
            if (recon.callout.rotate) box.style.transform = "rotate(" + recon.callout.rotate + "deg)";
            let inner = "";
            if (recon.kind === "gallery-import-deck") inner = reconKeepAsideRow(recon, 1.9);
            else if (recon.kind === "sound-player") inner = reconSoundPlayerCallout(recon);
            else if (recon.kind === "family-invite") inner = reconFamilyInviteCallout(recon);
            box.innerHTML = inner + (recon.callout.label ? `<div class="recon-callout-label">${reconEsc(recon.callout.label)}</div>` : "");
            calloutLayer.appendChild(box);
          }
        }

        // Non-hero slides may still use the free-floating spot-art slot.
        if (data.art && data.art.src) {
          artSlot.src = data.art.src;
          artSlot.classList.add("visible");
          artSlot.style.top = (data.art.top || "0") + "px";
          artSlot.style.left = (data.art.left || "0") + "px";
          artSlot.style.width = (data.art.width || "400") + "px";
          artSlot.style.height = (data.art.height || "400") + "px";
          if (data.art.z) artSlot.style.zIndex = data.art.z;
        }
      }

      // Wordmark lockup: {position: "top"|"bottom"} — top small (default),
      // bottom large (hero closing slide).
      const wm = data.wordmark || {};
      if (wm.position === "bottom") {
        wordmark.classList.add("bottom");
      }

      if (Array.isArray(data.chips)) {
        const emotionVarMap = {
          joy: "--emotion-joy",
          wonder: "--emotion-wonder",
          calm: "--emotion-calm",
          tender: "--emotion-tender",
          mischief: "--emotion-mischief",
          // The app's "funny" tag renders in the tender-pink pastel.
          funny: "--emotion-tender",
        };
        const isTabletBucket = TABLET_SIZES.has(sizeKey);
        data.chips.forEach((chip) => {
          const el = document.createElement("div");
          el.className = "chip";
          const colorVar = emotionVarMap[chip.emotion] || "--emotion-joy";
          el.style.background = "var(" + colorVar + ")";
          // Chip positions are authored against the phone layout; on the
          // tablet buckets the device geometry differs (full-bleed on
          // 9:16), so a chip may land on TEXT inside the capture. Optional
          // per-chip `top_pct_tablet` / `left_tablet` override the position
          // on the three tablet buckets only.
          const topPct = isTabletBucket && chip.top_pct_tablet != null ? chip.top_pct_tablet : chip.top_pct;
          const left = isTabletBucket && chip.left_tablet != null ? chip.left_tablet : chip.left;
          if (topPct != null) {
            el.style.top = topPct + "%";
          } else {
            el.style.top = (chip.top || 0) + "px";
          }
          el.style.left = (left || 0) + "px";
          el.style.width = (chip.size || 48) + "px";
          el.style.height = (chip.size || 48) + "px";
          if (chip.rotate) el.style.transform = "rotate(" + chip.rotate + "deg)";
          chipsLayer.appendChild(el);
        });
      }

      // Draft banner (WP-D §1d, revised per coordinator review) —
      // impossible-to-miss hazard frame + rotated stamp. Any slide with
      // `draft` set is excluded from upload manifests downstream (PART 4).
      //
      // `draft.buckets` (optional array of size keys) makes the banner
      // apply to ONLY those buckets on this slide — e.g. frame 07 is draft
      // on the iPhone buckets (truncated rows, no per-child collection) but
      // NOT on ipad (a genuine, complete per-child collection). Omitting
      // `buckets` applies the draft to every bucket, as before.
      const draftApplies =
        data.draft && data.draft.reason && (!Array.isArray(data.draft.buckets) || data.draft.buckets.includes(sizeKey));
      if (draftApplies) {
        stage.classList.add("is-draft");
        document.getElementById("draft-reason").textContent = data.draft.reason;
        const stampEl = document.querySelector(".draft-stamp");
        const STAMP_ANGLE_DEG = 4; // keep in sync with the CSS rotate() below
        const positionDraftStamp = () => {
          // Measure the BOTTOM of the last visible child of the caption
          // block (headline / script-accent / subline / disclosure) —
          // never just the support line — so a visible disclosure (e.g.
          // "Subscription required to add memories.") is never the thing
          // left uncleared.
          let maxChildBottom = 0;
          Array.from(caption.children).forEach((child) => {
            if (window.getComputedStyle(child).display === "none") return;
            const bottom = child.offsetTop + child.offsetHeight;
            if (bottom > maxChildBottom) maxChildBottom = bottom;
          });
          const captionBottom = caption.offsetTop + maxChildBottom;

          // `stampEl.style.top` becomes the box's vertical CENTER (the CSS
          // rule also applies translateY(-50%)). Rotating a wide, short box
          // by STAMP_ANGLE_DEG around that center means its axis-aligned
          // bounding box extends farther above the center than half its own
          // (unrotated) height — by halfWidth*sin(angle) + halfHeight*cos(angle)
          // (standard rotated-rect AABB formula). Measure the stamp's own
          // OFFSET (untransformed) width/height at runtime and compute that
          // exact clearance, rather than a guessed constant, so this stays
          // correct if the copy, angle, or stamp padding ever change.
          const halfW = stampEl.offsetWidth / 2;
          const halfH = stampEl.offsetHeight / 2;
          const angleRad = (STAMP_ANGLE_DEG * Math.PI) / 180;
          const aabbHalfHeight = halfW * Math.abs(Math.sin(angleRad)) + halfH * Math.abs(Math.cos(angleRad));
          const buffer = 16;
          const centerY = captionBottom + aabbHalfHeight + buffer;
          stampEl.style.top = Math.round(centerY) + "px";

          // The card/blocked content below was positioned with fixed
          // top_pct values authored against a flat gap estimate. On the
          // much shorter iPad stage (same local caption/stamp sizes, far
          // less stageH to work with) a top_pct tuned for the iPhone
          // buckets can land ABOVE the stamp's actual bottom edge. Rather
          // than hand-tune top_pct per bucket per drafted slide, push the
          // card/blocked content down (never up) just enough to clear the
          // stamp, using the same local-unit coordinate space.
          const stampBottom = centerY + aabbHalfHeight;
          const contentBuffer = 24;
          const minContentTop = stampBottom + contentBuffer;

          if (data.layout === "card") {
            const cardLayer = document.getElementById("card-layer");
            const children = Array.from(cardLayer.children);
            if (children.length) {
              const minChildTop = Math.min(...children.map((el) => el.offsetTop));
              cardLayer.style.transform = minChildTop < minContentTop ? `translateY(${Math.round(minContentTop - minChildTop)}px)` : "";
            }
          } else if (data.layout === "blocked") {
            const blockedArea = document.getElementById("blocked-area");
            if (blockedArea.offsetTop < minContentTop) {
              blockedArea.style.top = Math.round(minContentTop) + "px";
            }
          }
        };
        positionDraftStamp();
        document.fonts.ready.then(positionDraftStamp);
      }

      document.documentElement.setAttribute("data-ready", "true");
    }

    render();
  </script>
</body>
</html>
