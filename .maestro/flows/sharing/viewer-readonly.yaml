appId: com.memora.app
---
# Viewer-role read-only assertions (docs/features/family-sharing.md).
# Assumes TEST_EMAIL_2/TEST_PASSWORD_2 is a viewer member of a family with
# at least one existing memory -- e.g. the state left behind by running
# 01-04 in this directory once (owner invited that account with the
# "Viewer" role in step 1). NOT executed as part of this change; authored
# lint-by-eye only.
- launchApp:
    clearState: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Momora"
    below: "RECENTLY OPENED"
    optional: true
- tapOn:
    text: "Momora"
    below: "DEVELOPMENT SERVERS"
    optional: true
- assertVisible: "Welcome back"
- runFlow:
    file: ../auth/sign-in.yaml
    env:
      TEST_EMAIL: ${TEST_EMAIL_2}
      TEST_PASSWORD: ${TEST_PASSWORD_2}
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 90000

# No create FAB for a viewer (app/(app)/(tabs)/timeline.tsx gates
# MemoryFab on canEditFamilyContent(role)).
- assertNotVisible:
    id: new-memory-fab

# The Timeline's Calendar view applies the same role gate: viewers can
# browse the month grid but there's no create FAB. Switch back to List so
# the saved view doesn't leak into later flows.
- tapOn:
    id: timeline-view-calendar
- extendedWaitUntil:
    visible:
      id: calendar-grid
    timeout: 15000
- assertNotVisible:
    id: new-memory-fab
- tapOn:
    id: timeline-view-list

# Keepsakes: viewers see the family's films (Year Film P2) but never books or
# the Create a book CTA. A family without films shows the gentle empty line
# instead, so wait for either.
- tapOn:
    id: tab-keepsakes
- extendedWaitUntil:
    visible:
      id: "keepsakes-viewer-empty|keepsakes-year-.*"
    timeout: 15000
- assertNotVisible:
    id: memory-books-create
- assertNotVisible:
    id: memory-books-empty

# Viewers get the trimmed Settings screen: no journaling reminder, invites,
# family settings, or photo import. Members stays (report/block safety).
- tapOn:
    text: "Settings"
- assertNotVisible:
    id: settings-daily-reminder-toggle
- assertNotVisible:
    id: settings-invite-family-member
- assertNotVisible:
    id: settings-family-settings
- assertNotVisible:
    id: settings-gallery-import
- assertVisible:
    id: settings-family-members

# Open the first memory and confirm no edit affordances
# (app/(app)/memory/[id]/index.tsx only renders onEdit/onDelete when
# canEditFamilyContent(role) is true).
- tapOn:
    text: "Timeline"
- tapOn:
    id: "memory-card-.*"
- assertNotVisible:
    id: memory-detail-edit
- assertNotVisible:
    id: memory-detail-delete
