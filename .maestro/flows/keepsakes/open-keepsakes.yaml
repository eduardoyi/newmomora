appId: com.memora.app
---
# Keepsakes tab (docs/features/keepsakes.md): the tab opens, shows either the
# family's book shelves or the one family pitch, and (for an owner/manager)
# the Create a book CTA -- which opens the create sheet directly for a
# one-child family or "Whose book?" first when there are several. Stops at
# the open sheet -- no book is started. Assumes the account has at least one
# child (otherwise the CTA reads "Go to Family").
- runFlow: ../auth/login.yaml
- tapOn:
    id: tab-keepsakes
- extendedWaitUntil:
    visible:
      id: keepsakes-header
    timeout: 15000
- assertVisible: "Made from your moments."
- extendedWaitUntil:
    visible:
      id: memory-books-create
    timeout: 15000
- tapOn:
    id: memory-books-create
- runFlow:
    when:
      visible:
        id: child-picker-sheet
    commands:
      - tapOn:
          id: "child-picker-.*"
          index: 0
- extendedWaitUntil:
    visible:
      id: create-book-sheet
    timeout: 15000
