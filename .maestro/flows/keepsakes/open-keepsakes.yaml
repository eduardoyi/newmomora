appId: com.memora.app
---
# Keepsakes tab (docs/features/keepsakes.md, docs/plans/keepsakes-redesign.md):
# the tab opens with its header and the "Your keepsakes" library, and (for an
# owner/manager) the "Make something" storefront -- whose Memory Book card
# opens the native product page. Stops on the product page -- no book is
# started. Assumes an owner/manager account whose family has at least one
# film or book (otherwise the library shows the "first one is on its way" line
# instead of `keepsakes-library`).
- runFlow: ../auth/login.yaml
- tapOn:
    id: tab-keepsakes
- extendedWaitUntil:
    visible:
      id: keepsakes-header
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: keepsakes-library
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: keepsakes-store-memory-book
    timeout: 15000
- tapOn:
    id: keepsakes-store-memory-book
- extendedWaitUntil:
    visible:
      id: keepsakes-product-memory-book
    timeout: 15000
