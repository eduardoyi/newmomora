appId: com.memora.app
---
# Owner happy path: S0 (welcome) through the full story/capture/trust/paywall
# arc to S16 and into the real journal (docs/plans/onboarding-implementation.md
# WP5 -- the front door now lands an unauthenticated launch on
# app/(onboarding)/welcome.tsx instead of app/(auth)/login.tsx, per spec
# decision 2). Depends on every S0-S16 screen (WP0-WP3) already landed.
#
# The full local runner is `npm run test:e2e:onboarding`. It uses the staged
# owner-happy-path-{pre,post}-otp.yaml files so it can read the OTP from
# local Mailpit between Maestro invocations, then removes the fresh fixture.
# This standalone version is retained for targeted debugging when both
# TEST_ONBOARDING_OWNER_EMAIL and TEST_ONBOARDING_OWNER_OTP are supplied.
# It must only point at a local Supabase project and local image stack.
#
# S16 intentionally drives the real system photo picker using the bundled
# profile fixture, exactly as add-family-member-with-picker.yaml does.
# - The notification step (S11) picks "No reminders"
#   (onboarding-notifications-option-none) specifically to avoid the native
#   OS permission dialog, which is non-deterministic to script -- the other
#   three options are equally valid choices, just not scripted here.
- addMedia:
    - ../../assets/profile-fixture.jpg
- launchApp:
    appId: com.memora.app
    clearState: true
    arguments:
      EXDevMenuIsOnboardingFinished: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Momora"
    below: "RECENTLY OPENED"
    optional: true
- tapOn:
    text: "Momora"
    below: "DEVELOPMENT SERVERS"
    optional: true
- extendedWaitUntil:
    visible:
      id: onb-welcome-screen
    timeout: 90000

# S0 -> S1-S3 (story beats) -> founders -> artifact
- tapOn:
    id: onb-welcome-start-button
- tapOn:
    id: onb-story-0-cta-button
- tapOn:
    id: onb-story-1-cta-button
- tapOn:
    id: onb-story-2-cta-button
- tapOn:
    id: onb-founders-cta-button
- tapOn:
    id: onb-artifact-cta-button

# S6 -- kids: a single typed-but-never-"+ Add another"-tapped name must still
# unblock Continue (plan WP1 note; kids.tsx's own canContinue check).
- tapOn:
    id: onb-kids-input
- inputText: "Lila"
- tapOn:
    id: onb-kids-continue-button

# S7 -- accept the auto-suggested family name as-is.
- tapOn:
    id: onb-family-name-continue-button

# S8 -- bridge to capture.
- tapOn:
    id: onb-bridge-cta-button

# S9 -- typed capture path. Voice needs mic hardware/permissions this happy
# path deliberately avoids; "I'd rather type" is itself a first-class
# fallback, not a workaround.
- tapOn:
    id: onboarding-capture-type-instead
- tapOn:
    id: onboarding-capture-textarea
- inputText: "Colored outside every single line today and was very proud of it."
- tapOn:
    id: onboarding-capture-keep

# S10 (aha) -> S10b (year showcase)
- tapOn:
    id: onboarding-aha-continue
- tapOn:
    id: onboarding-year-continue

# S11 -- notification question (see header note on why "none").
- tapOn:
    id: onboarding-notifications-option-none

# S12A -- name + email (WP6 added the owner's display name field above the
# email input; both must be non-empty before the CTA enables), then
# S12B -- OTP code (auto-verifies once 6 digits are entered; see
# app/(onboarding)/code.tsx's handleChangeCode).
- tapOn:
    id: onboarding-email-name-input
- inputText: "Rosa"
- tapOn:
    id: onboarding-email-input
- inputText: ${TEST_ONBOARDING_OWNER_EMAIL}
- tapOn:
    id: onboarding-email-send

- extendedWaitUntil:
    visible:
      id: onboarding-code-input
    timeout: 15000
- tapOn:
    id: onboarding-code-input
- inputText: ${TEST_ONBOARDING_OWNER_OTP}

# commitOnboarding runs here (creates the family, the kid, the first memory)
# before S13 renders -- give it real network round-trip time.
- extendedWaitUntil:
    visible:
      id: onb-trial-screen
    timeout: 20000

# S13 -> S14 -> S15. The paywall is a real RevenueCat purchase flow. Run this
# smoke path only with a store-configured Apple sandbox or Play internal-test
# account; it must never use a production account or a real purchase.
- tapOn:
    id: onb-trial-cta-button
- tapOn:
    id: onb-included-cta-button
- tapOn:
    id: onb-paywall-cta-button

# S16 -- real photo -> portrait kickoff, via the system picker (see header
# note -- no dev fixture shortcut exists on this screen).
- extendedWaitUntil:
    visible:
      id: onb-portrait-choose-photo-button
    timeout: 15000
- tapOn:
    id: onb-portrait-choose-photo-button
- tapOn:
    text: "Allow Full Access"
    optional: true
- tapOn:
    text: "Allow Access to All Photos"
    optional: true
- runFlow: ../shared/pick-first-image.yaml
- tapOn:
    text: "Choose"
    optional: true
- extendedWaitUntil:
    visible:
      id: onb-portrait-painting-frame
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: onb-reveal-screen
    timeout: 240000
- extendedWaitUntil:
    visible:
      id: onb-reveal-portrait-image-loaded
    timeout: 30000
- tapOn:
    id: onb-reveal-done-button

- extendedWaitUntil:
    visible: "Timeline"
    timeout: 20000
