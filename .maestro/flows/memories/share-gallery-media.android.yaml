appId: com.memora.app
tags:
  - android
---
# Native warm-share smoke. Momora stays running while Google Photos shares
# back into it: that is the Pixel failure mode covered by singleTop plus
# documentLaunchMode="never". Run on an Android emulator with Google Photos and
# a freshly rebuilt dev client (the manifest is native configuration). The
# fixture has DateTimeOriginal=2024:03:05; Google Photos/import behavior can
# strip EXIF, so this is a release smoke rather than a deterministic CI test.
- runFlow: ../auth/login.yaml
- addMedia:
    - ../../assets/capture-date-fixture.jpg
- launchApp:
    appId: com.google.android.apps.photos
- tapOn:
    id: com.google.android.apps.photos:id/image
    index: 0
    optional: true
- tapOn:
    text: "Photo,.*"
    index: 0
    optional: true
- tapOn:
    text: "Share"
- tapOn:
    text: "Momora"
- extendedWaitUntil:
    visible:
      id: new-memory-media-preview
    timeout: 20000
- assertVisible:
    id: new-memory-save
- assertVisible:
    id: new-memory-date
    text: ".*2024.*"
- assertVisible:
    id: new-memory-date-source
    text: "From media"
