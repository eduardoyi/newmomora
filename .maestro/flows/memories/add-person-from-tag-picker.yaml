appId: com.memora.app
---
# Add a new person from the composer's "Who's in it" row without leaving the
# memory: the full add-person form opens over the composer, and the created
# person comes back already tagged. Needs the E2E fixture build
# (add-family-member-photo-fixture).
- runFlow: ../auth/login.yaml
- tapOn:
    id: new-memory-fab
- extendedWaitUntil:
    visible: "New memory"
    timeout: 15000
- tapOn:
    id: new-memory-content
- eraseText
- inputText: "Story time before bed."
- tapOn: "New memory"
- tapOn:
    id: memory-tag-add
- extendedWaitUntil:
    visible:
      id: add-family-member-name
    timeout: 10000
- tapOn:
    id: add-family-member-photo-fixture
- runFlow: ../shared/save-family-member-form.yaml
# Back on the composer: the draft text survived and the new person is tagged.
- extendedWaitUntil:
    visible: "Story time before bed."
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: memory-tag-count
    timeout: 10000
