appId: com.memora.app
---
- launchApp:
    appId: com.memora.app
    clearState: true
    arguments:
      EXDevMenuIsOnboardingFinished: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Momora"
    below: "RECENTLY OPENED"
    optional: true
- tapOn:
    text: "Momora"
    below: "DEVELOPMENT SERVERS"
    optional: true
# `clearState: true` above now lands on app/(onboarding)/welcome.tsx (S0),
# not "Welcome back" directly -- the front door change in
# docs/plans/onboarding-implementation.md WP5 (spec decision 2: "the new
# flow is the front door"). Tap S0's quiet "Log in" link to reach the login
# screen before waiting on it below.
- tapOn:
    id: onb-welcome-login-link
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 90000
- tapOn:
    id: login-email-input
- inputText: ${REVIEWER_EMAIL}
- tapOn:
    id: login-submit-button
- extendedWaitUntil:
    visible: "Enter your password"
    timeout: 10000
- tapOn:
    id: password-input
- inputText: ${REVIEWER_PASSWORD}
- tapOn:
    id: password-submit-button
- extendedWaitUntil:
    visible: "Timeline"
    timeout: 90000
