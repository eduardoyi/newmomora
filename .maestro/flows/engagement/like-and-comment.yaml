appId: com.memora.app
---
- runFlow: ../memories/create-memory.yaml
# Tap = heart reaction (toggle); the reactions summary appears with a count.
- tapOn:
    id: "memory-like-.*"
- assertVisible: "Remove reaction ❤️"
- assertVisible:
    id: "memory-reactions-.*"
# Long-press opens the tray; picking a different emoji replaces the reaction.
- longPressOn:
    id: "memory-like-.*"
- extendedWaitUntil:
    visible:
      id: reaction-tray
    timeout: 5000
- tapOn:
    id: "reaction-tray-😂"
- extendedWaitUntil:
    visible: "Remove reaction 😂"
    timeout: 5000
# The summary opens the who-reacted sheet with my row.
- tapOn:
    id: "memory-reactions-.*"
- extendedWaitUntil:
    visible:
      id: reactions-sheet
    timeout: 5000
- assertVisible: "You"
- assertVisible: "Tap to remove"
- assertVisible: "😂"
- tapOn:
    id: reactions-sheet-close
- extendedWaitUntil:
    notVisible:
      id: reactions-sheet
    timeout: 5000
- tapOn:
    id: "memory-comments-.*"
- extendedWaitUntil:
    visible:
      id: comments-drawer
    timeout: 10000
- tapOn:
    id: comment-input
- assertVisible: "Comments"
- inputText: "I love this moment."
- tapOn:
    id: comment-submit
- extendedWaitUntil:
    visible: "I love this moment."
    timeout: 10000
- hideKeyboard
- waitForAnimationToEnd
- swipe:
    start: "50%, 25%"
    end: "50%, 70%"
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: comments-drawer
    timeout: 5000
