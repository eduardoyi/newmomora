appId: com.memora.app
---
- runFlow: ../memories/create-memory.yaml
# No reactions yet: the smiley-plus button opens the tray; pick a heart.
- tapOn:
    id: "memory-react-.*"
- extendedWaitUntil:
    visible:
      id: reaction-tray
    timeout: 5000
- tapOn:
    id: "reaction-tray-❤️"
- extendedWaitUntil:
    visible:
      id: "memory-reactions-.*"
    timeout: 5000
# Long-press the pill to change the reaction to 😂.
- longPressOn:
    id: "memory-reactions-.*"
- extendedWaitUntil:
    visible:
      id: reaction-tray
    timeout: 5000
- tapOn:
    id: "reaction-tray-😂"
- waitForAnimationToEnd
# Tapping the pill opens the who-reacted sheet with my row.
- tapOn:
    id: "memory-reactions-.*"
- extendedWaitUntil:
    visible:
      id: reactions-sheet
    timeout: 5000
- assertVisible: "You"
- assertVisible: "Tap to remove"
- assertVisible: "😂"
- tapOn:
    id: reactions-sheet-close
- extendedWaitUntil:
    notVisible:
      id: reactions-sheet
    timeout: 5000
- tapOn:
    id: "memory-comments-.*"
- extendedWaitUntil:
    visible:
      id: comments-drawer
    timeout: 10000
- tapOn:
    id: comment-input
- assertVisible: "Comments"
- inputText: "I love this moment."
- tapOn:
    id: comment-submit
- extendedWaitUntil:
    visible: "I love this moment."
    timeout: 10000
- hideKeyboard
- waitForAnimationToEnd
- swipe:
    start: "50%, 25%"
    end: "50%, 70%"
    duration: 300
- extendedWaitUntil:
    notVisible:
      id: comments-drawer
    timeout: 5000
